name: Build

on:
  push:
    branches:
      - main2
  pull_request:
    branches:
      - main2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set variables
        run: |
          version="v$(grep -m1 versionName app/build.gradle | awk -F'"' '{print $2}')"
          commit="$(echo "${GITHUB_SHA}" | cut -c-7)"
          repo="${GITHUB_REPOSITORY#${GITHUB_REPOSITORY_OWNER}/}"
          timestamp="$(TZ='Asia/Tokyo' date +'%Y%m%d%H%M%S')"
          {
            echo "name=${repo}-${version}-${commit}-${timestamp}"
          } >> "$GITHUB_ENV"

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --warning-mode=all assembleRelease
          mv -vf app/build/outputs/apk/release/app-release.apk "${{ env.name }}.apk"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.name }}
          path: ${{ env.name }}.apk
          if-no-files-found: error
